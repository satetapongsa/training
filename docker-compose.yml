services:
  studio:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ai_vision_studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:////app/data/studio.db
      - SECRET_KEY=prod-secret-key-change-in-production-ai-vision-studio
      - MAX_UPLOAD_SIZE_MB=1000
    volumes:
      - studio_data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  studio_data:
    driver: local
